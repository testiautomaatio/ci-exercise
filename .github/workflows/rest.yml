name: Testing the rest API

on: [push]

permissions:
  contents: read
  statuses: write

jobs:
  test-rest-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Autograding
        if: always()
        uses: ohjelmistokehitys/autograder@v0
