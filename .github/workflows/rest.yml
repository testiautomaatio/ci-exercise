name: Testing the rest API

on: [push]

permissions:
  contents: read
  statuses: write

jobs:
  test-rest-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Start the REST API
        run: docker compose -f app/compose.yaml up --detach

      - name: Wait for the REST API to be ready
        run: curl --retry 10 --retry-delay 5 --retry-all-errors http://localhost:3000/health

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Autograding
        if: always()
        uses: ohjelmistokehitys/autograder@v0
